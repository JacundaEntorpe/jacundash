[package]
name = "jacundash"
version = "0.1.0"
edition = "2024"
description = "Lançador rápido pra qualquer Linux, com categorias e plugins"
license = "MIT"

[features]
default = ["layer-shell"]
# Janela no topo da tela no Wayland (KDE, Hyprland, Sway...). Sem isso vira uma janela comum.
layer-shell = ["dep:gtk4-layer-shell"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = { version = "0.8", optional = true }
async-channel = "2"
gio-unix = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
toml = "1"
toml_edit = "0.25"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
